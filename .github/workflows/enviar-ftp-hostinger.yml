# Envia a pasta public_html para a Hostinger por FTP sempre que o site muda no ramo main.
# Servidor e usuário (não confidenciais) ficam aqui. Só a senha é segredo:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret → Name: FTP_SENHA
# Envia só o que mudou. Não apaga arquivos que existam só no servidor.
name: Enviar para a Hostinger (FTP)
on:
  push:
    branches: [main]
    paths: ["public_html/**", ".github/workflows/enviar-ftp-hostinger.yml"]
  workflow_dispatch:
concurrency: enviar-ftp-hostinger
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEM_FTP: ${{ secrets.FTP_SENHA != '' }}
    steps:
      - name: Conferir configuração
        if: env.TEM_FTP != 'true'
        run: echo "::notice::FTP ainda não configurado (falta cadastrar o segredo FTP_SENHA). Nada foi enviado."
      - uses: actions/checkout@v4
        if: env.TEM_FTP == 'true'
      - name: Enviar arquivos
        if: env.TEM_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 185.173.111.243
          username: u392943334.danova-ai-com-417732.hostingersite.com
          password: ${{ secrets.FTP_SENHA }}
          local-dir: ./public_html/
          server-dir: public_html/
          port: 21
