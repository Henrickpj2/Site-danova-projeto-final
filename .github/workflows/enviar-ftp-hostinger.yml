# Envia a pasta public_html para a Hostinger por FTP sempre que o site muda no ramo main.
# Servidor e usuário (não confidenciais) ficam aqui. Só a senha é segredo:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret → Name: FTP_SENHA
# Envia só o que mudou. Não apaga arquivos que existam só no servidor.
name: Enviar para a Hostinger (FTP)
on:
  push:
    branches: [main]
    paths: ["public_html/**", ".github/workflows/enviar-ftp-hostinger.yml"]
  workflow_dispatch:
concurrency: enviar-ftp-hostinger
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEM_FTP: ${{ secrets.FTP_SENHA != '' }}
    steps:
      - name: Conferir configuração
        if: env.TEM_FTP != 'true'
        run: echo "::notice::FTP ainda não configurado (falta cadastrar o segredo FTP_SENHA). Nada foi enviado."
      - uses: actions/checkout@v4
        if: env.TEM_FTP == 'true'
      - name: Enviar arquivos
        id: envio1
        if: env.TEM_FTP == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: &ftp
          server: 185.173.111.243
          username: u392943334.danova-ai-com-417732.hostingersite.com
          password: ${{ secrets.FTP_SENHA }}
          protocol: ftps
          security: loose
          port: 21
          timeout: 120000
          local-dir: ./public_html/
          server-dir: public_html/
      - name: Enviar arquivos (nova tentativa)
        if: env.TEM_FTP == 'true' && steps.envio1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp
      - name: Conferir o site no ar
        if: env.TEM_FTP == 'true'
        run: |
          sleep 5
          echo "DNS danova-ai.com: $(getent hosts danova-ai.com || echo 'não resolve')"
          echo "DNS www.danova-ai.com: $(getent hosts www.danova-ai.com || echo 'não resolve')"
          echo "DNS provisório: $(getent hosts danova-ai-com-417732.hostingersite.com || echo 'não resolve')"
          ok=0
          for base in "https://danova-ai.com" "https://danova-ai-com-417732.hostingersite.com"; do
            code=$(curl -s -L -o pagina.html -w "%{http_code}" -H "Cache-Control: no-cache" "$base/crm/?v=$GITHUB_RUN_ID" || echo "falhou($?)")
            echo "$base/crm/ → HTTP $code"
            if [ "$code" = "200" ] && grep -q 'name="creci"' pagina.html; then echo "  versão nova no ar (cadastro com CRECI)."; ok=1; fi
          done
          [ $ok = 1 ] || { echo "::error::Não confirmei a versão nova no ar."; exit 1; }
