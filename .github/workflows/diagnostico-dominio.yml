name: Diagnóstico do domínio
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          for r in 1.1.1.1 8.8.8.8; do echo "== @$r"; dig +short NS danova-ai.com @$r; dig +short A danova-ai.com @$r; dig danova-ai.com @$r | grep -E "status:"; done
          echo "== registro .com"; dig +short NS danova-ai.com @a.gtld-servers.net; dig danova-ai.com NS @a.gtld-servers.net +norec | grep -E "status:|AUTHORITY" 
          echo "== whois"; whois danova-ai.com 2>/dev/null | grep -iE "Registrar:|Expir|Status|Name Server|Updated|Creation" | head -20
          echo "== site provisório"
          B=https://danova-ai-com-417732.hostingersite.com
          curl -s -D /tmp/h -o /tmp/r $B/ ; grep -iE "^(server|x-powered|platform|location|content-type)" /tmp/h; grep -o "<title>[^<]*" /tmp/r; grep -oE 'src="[^"]+"' /tmp/r | head -8
          for p in /public_html/index.html /public_html/crm/ /api/lead.php /robots.txt /llms.txt /js/crm-config.js; do echo "$p → $(curl -s -o /tmp/r -w '%{http_code}' $B$p)"; done
          echo "== NS dns-parking"; dig danova-ai.com A @aster.dns-parking.com | grep -E "status:|^danova"; dig danova-ai.com A @helios.dns-parking.com | grep -E "status:|^danova"
